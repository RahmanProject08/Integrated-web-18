name: Test Webhook and Telegram Notification

on:
  workflow_dispatch:
    inputs:
      status_kejadian:
        description: "Status Kejadian (AMAN / BAHAYA)"
        required: true
        default: "BAHAYA"
      threat_level:
        description: "Level Ancaman (LOW / MEDIUM / HIGH / CRITICAL)"
        required: true
        default: "HIGH"
      detail_pesan:
        description: "Detail Pesan Ancaman"
        required: true
        default: "Uji Coba Integrasi: Terdeteksi anomali trafik mencurigakan pada database"

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Jalankan Script Pengiriman Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_STATUS: ${{ github.event.inputs.status_kejadian }}
          INPUT_LEVEL: ${{ github.event.inputs.threat_level }}
          INPUT_DETAIL: ${{ github.event.inputs.detail_pesan }}
        run: python send_test_telegram.py
